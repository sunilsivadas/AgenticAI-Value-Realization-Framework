# Key figures and benchmarks cited in the Realized Value article series.
# Aligned with the series as published on 2026-11-24.
#
# Every figure carries its evidence type. The series treats these differently:
#   peer-reviewed    a paper at a recognised venue
#   government       a public body's own evaluation
#   independent      a third party with no stake in the result
#   preprint         a paper that has not been peer-reviewed
#   vendor-reported  the company that makes or sells the system
#   self-reported    survey answers or a company's account of itself
#   analyst          an analyst firm's survey or forecast
#   legal            a court or tribunal decision
#   computed         arithmetic on the inputs above it
#
# Figures date quickly. Check the live article before quoting one.

series:
  title: "Realized Value: A Framework for Evaluating Agentic AI in the Enterprise"
  author: "Sunil Sivadas"
  url: "https://sunilsivadas.github.io/realized-value.html"
  aligned_on: "2026-11-24"
  formula: "realized value = capability x cost x reliability x safety x controllability"
  articles:
    - {part: 0, title: "Realized Value: A Framework for Evaluating Agentic AI in the Enterprise", url: "https://sunilsivadas.github.io/realized-value.html", version: "v22"}
    - {part: 1, title: "Capability is a system property", url: "https://sunilsivadas.github.io/capability.html", version: "v33", reference_url: "https://sunilsivadas.github.io/capability-reference.html"}
    - {part: 2, title: "Cost engineering for agentic AI", url: "https://sunilsivadas.github.io/cost.html", version: "v21", reference_url: "https://sunilsivadas.github.io/cost-levers.html"}
    - {part: 3, title: "Reliability is getting it right every time", url: "https://sunilsivadas.github.io/reliability.html", version: "v12", reference_url: "https://sunilsivadas.github.io/reliability-reference.html"}
    - {part: 4, title: "Safety is how an agent behaves when it is unsure", url: "https://sunilsivadas.github.io/safety.html", version: "v9", reference_url: "https://sunilsivadas.github.io/safety-reference.html"}
    - {part: 5, title: "Controllability is what you can do when the agent is wrong", url: "https://sunilsivadas.github.io/controllability.html", version: "v9", reference_url: "https://sunilsivadas.github.io/controllability-reference.html"}
    - {part: 6, title: "From framework to ROI", url: "https://sunilsivadas.github.io/roi.html", version: "v12"}

units:
  capability: "Score on a relevant, unsaturated benchmark or internal eval, under generous conditions, with no reliability threshold"
  cost: "Cost per successful task = cost per run / success rate"
  reliability: "pass^k, with the hand-back rate and the silent-failure rate"
  safety: "Severity-weighted unsafe-action rate, at its intervention rate"
  controllability: "Bounded share, bound-leak rate, time-to-halt, gate load"

