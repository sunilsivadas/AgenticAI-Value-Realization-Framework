worked_case:
  name: "Customer service agent, priced per conversation"
  article: "https://sunilsivadas.github.io/roi.html"
  formula: "saving = resolution rate x (human cost - price per resolution) - silent-failure rate x cost of a silent failure"
  inputs:
    - {name: "Human cost per live contact", value: 8.01, unit: "USD", date: "2019-09", source_url: "https://www.gartner.com/en/newsroom/press-releases/2019-09-25-gartner-says-only-9--of-customers-report-solving-thei", evidence: analyst}
    - {name: "Agent price per resolution", value: 0.99, unit: "USD", date: "2026-11-01", source_url: "https://www.intercom.com/help/en/articles/8205718-fin-resolutions", evidence: vendor-reported}
    - {name: "Resolution rate, vendor average", value: 0.76, date: "2026-03", source_url: "https://fin.ai/learn/roi-ai-customer-service-agents-benchmarks", evidence: vendor-reported}
    - {name: "Resolution rate, one deployment", value: 0.508, date: "2026-03", source_url: "https://fin.ai/learn/roi-ai-customer-service-agents-benchmarks", evidence: vendor-reported}
    - {name: "Cost of a silent failure, high end", value: 600, unit: "USD", date: "2024", source_url: "https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do", evidence: legal, notes: "C$812.02 ordered by the tribunal"}
    - {name: "Silent-failure rate", value: null, evidence: "unreported", notes: "No public source found"}
  results:
    - {name: "Saving per conversation at 76%, no silent failures", value: 5.34, unit: "USD", evidence: computed}
    - {name: "Saving per conversation at 50.8%, no silent failures", value: 3.57, unit: "USD", evidence: computed}
    - {name: "Silent-failure rate that erases the saving at 76%, at USD 600 a failure", value: 0.009, evidence: computed}
    - {name: "Silent-failure rate that erases the saving at 50.8%, at USD 600 a failure", value: 0.006, evidence: computed}

benchmarks:

  - {name: "GDPval", factor: capability, url: "https://arxiv.org/abs/2510.04374", measures: "Single-deliverable parity with human experts across 44 occupations", evidence: preprint}
  - {name: "GDPval-AA", factor: capability, url: "https://artificialanalysis.ai/evaluations/gdpval-aa", measures: "The same target, run through a standard open harness", evidence: independent}
  - {name: "Remote Labor Index", factor: capability, url: "https://labs.scale.com/leaderboard/rli", measures: "End-to-end autonomous completion of real freelance projects", evidence: independent}
  - {name: "Epoch Capabilities Index", factor: capability, url: "https://epoch.ai/eci", measures: "Composite scale stitching 40+ benchmarks", evidence: independent}
  - {name: "METR time horizons", factor: capability, url: "https://metr.org/time-horizons/", measures: "Length of task at a given reliability threshold", evidence: independent, status: "No longer updated since September 2026"}
  - {name: "Agents' Last Exam", factor: capability, url: "https://snorkel.ai/blog/agents-last-exam-reading-group/", measures: "1,500 professional workflows across 55 fields", evidence: preprint}
  - {name: "Terminal-Bench 4.0", factor: capability, url: "https://www.tbench.ai/news/terminal-bench-4-0", measures: "66 long agentic tasks in a terminal", evidence: independent, status: "Rated Flawed by Epoch AI"}
  - {name: "SWE-bench Pro", factor: capability, url: "https://labs.scale.com/leaderboard/swe_bench_pro_public", measures: "Real GitHub issues across larger codebases", evidence: independent}
  - {name: "SWE-bench Live", factor: capability, url: "https://swe-bench-live.github.io/", measures: "The same target, on issues never seen during training", evidence: independent}
  - {name: "HAL", factor: capability, url: "https://arxiv.org/pdf/2510.11977", measures: "Cost-aware agent capability across nine benchmarks", evidence: peer-reviewed}
  - {name: "BFCL v4", factor: capability, url: "https://gorilla.cs.berkeley.edu/blogs/17_bfcl_v4_prompt_variation.html", measures: "Function calling, web search, memory, multi-turn", evidence: independent}
  - {name: "BEAVER", factor: capability, url: "https://arxiv.org/abs/2409.02038", measures: "Questions over private company data warehouses with thin documentation", evidence: preprint}
  - {name: "HOH", factor: reliability, url: "https://aclanthology.org/2025.acl-long.301.pdf", measures: "The effect of outdated passages on retrieval-based answers", evidence: peer-reviewed}
  - {name: "MTEB", factor: capability, url: "https://huggingface.co/spaces/mteb/leaderboard", measures: "Retrieval and embedding capability", evidence: independent}
  - {name: "OSWorld 2.0", factor: reliability, url: "https://arxiv.org/abs/2606.29537", measures: "108 long workflows across desktop applications", evidence: preprint}
  - {name: "tau-bench and tau2-bench", factor: reliability, url: "https://github.com/sierra-research/tau2-bench", measures: "Agents serving simulated users under a written policy; pass^k built in", evidence: preprint}
  - {name: "APEX-Agents", factor: reliability, url: "https://arxiv.org/abs/2601.14242", measures: "Banking, consulting and legal work; pass@k and pass^k", evidence: vendor-reported}
  - {name: "HAL Reliability Dashboard", factor: reliability, url: "https://hal.cs.princeton.edu/reliability/", measures: "Twelve reliability metrics with paraphrase and injected faults", evidence: peer-reviewed}
  - {name: "OpenAgentSafety", factor: safety, url: "https://arxiv.org/abs/2507.06134", measures: "356 tasks with real tools, graded on the final environment state", evidence: peer-reviewed}
  - {name: "ToolEmu", factor: safety, url: "https://arxiv.org/abs/2309.15817", measures: "Risky tool use; 144 test cases across 36 toolkits", evidence: peer-reviewed}
  - {name: "OS-Harm", factor: safety, url: "https://arxiv.org/abs/2506.14866", measures: "150 computer-use tasks: misuse, injection and unsafe actions", evidence: peer-reviewed}
  - {name: "Agent-SafetyBench", factor: safety, url: "https://arxiv.org/abs/2412.14470", measures: "2,000 cases in 349 environments, 8 risk categories", evidence: preprint}
  - {name: "SHADE-Arena", factor: safety, url: "https://arxiv.org/abs/2506.15740", measures: "A hidden harmful side task alongside a real one", evidence: preprint}
  - {name: "MASK", factor: safety, url: "https://arxiv.org/abs/2503.03750", measures: "Whether a model contradicts its own beliefs under pressure", evidence: preprint}
  - {name: "FTA", factor: safety, url: "https://arxiv.org/abs/2609.35732", measures: "False success reports after a tool fails", evidence: preprint}
  - {name: "OverclaimBench", factor: safety, url: "https://arxiv.org/abs/2609.20812", measures: "Claimed coverage against files read", evidence: preprint}
  - {name: "CAPE-Bench", factor: safety, url: "https://arxiv.org/abs/2610.17301", measures: "Authorisation violations and the lies that follow", evidence: preprint}
  - {name: "AgentDecept", factor: safety, url: "https://arxiv.org/abs/2610.39377", measures: "Reports compared with executed-action records", evidence: preprint}

